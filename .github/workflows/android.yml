name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Test and build optimized APKs
        run: gradle testDebugUnitTest assembleDebug assembleRelease
      - name: Report APK sizes
        run: |
          echo "Dimensione APK debug ottimizzato:"
          stat -c '%n: %s byte (%h blocchi)' app/build/outputs/apk/debug/app-debug.apk
          echo "Dimensione APK release ottimizzato (non firmato):"
          stat -c '%n: %s byte (%h blocchi)' app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload installable optimized debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calcolo-giorni-e-date-apk-ottimizzato
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 5
- name: Keep only the 3 latest APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          ARTIFACT_NAMES: '["calcolo-giorni-e-date-apk-ottimizzato"]'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GH_REPOSITORY}/actions/artifacts?per_page=100"
          response=$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api") || {
            echo "::warning::Impossibile consultare gli Artifacts: pulizia rinviata."
            exit 0
          }
          mapfile -t obsolete < <(printf '%s' "$response" | jq -r --argjson names "$ARTIFACT_NAMES" '
            [.artifacts[] | select(.expired == false) | select(.name as $n | ($names | index($n)) != null)]
            | group_by(.name)[]
            | sort_by(.created_at)
            | reverse
            | .[3:][]
            | .id
          ')
          for artifact_id in "${obsolete[@]}"; do
            if ! curl -fsS -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GH_REPOSITORY}/actions/artifacts/${artifact_id}" >/dev/null; then
              echo "::warning::Non è stato possibile eliminare l'Artifact ${artifact_id}."
            else
              echo "Eliminato Artifact obsoleto: ${artifact_id}"
            fi
          done
