name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Test and build optimized APKs
        run: gradle testDebugUnitTest assembleDebug assembleRelease
      - name: Report APK sizes
        run: |
          echo "Dimensione APK debug ottimizzato:"
          stat -c '%n: %s byte (%h blocchi)' app/build/outputs/apk/debug/app-debug.apk
          echo "Dimensione APK release ottimizzato (non firmato):"
          stat -c '%n: %s byte (%h blocchi)' app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload installable optimized debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calcolo-giorni-e-date-apk-ottimizzato
          path: app/build/outputs/apk/debug/app-debug.apk
